name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scratch
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scratch -d ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://scratch:scratch@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Type-check
        run: npx tsc --noEmit -p backend/tsconfig.json
      - name: Build
        run: npm run build --workspace=backend
      - name: Apply schema to the throwaway CI database
        run: npx prisma db push --schema backend/prisma/schema.prisma --skip-generate
        env:
          DATABASE_URL: postgresql://scratch:scratch@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://scratch:scratch@localhost:5432/ci
      - name: Unit + real-Postgres integration tests
        run: npm test --workspace=backend

  admin-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: admin-dashboard
      - run: npx next build
        working-directory: admin-dashboard

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
