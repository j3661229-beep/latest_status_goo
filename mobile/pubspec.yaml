name: status_go
description: "Status Go (स्टेटस गो) — Daily Status Maker for Indian Users"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.2

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  lottie: ^3.1.0
  animations: ^2.0.11

  # Canvas / Image customization
  screenshot: ^2.3.0
  image: ^4.2.0
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  path_provider: ^2.1.4

  # HTTP & API
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth
  google_sign_in: ^6.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Push Notifications
  onesignal_flutter: ^5.1.6

  # Audio / Voice Search
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

  # Sharing
  share_plus: ^9.0.0
  social_share: ^2.3.1
  url_launcher: ^6.3.0

  # Analytics
  firebase_analytics: ^11.2.0
  firebase_core: ^3.1.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.1
  flutter_local_notifications: ^17.2.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
