name: status_go
description: "Status Go (स्टेटस गो) — Daily Status Maker for Indian Users"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.2

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0

  # Image picking
  image_picker: ^1.1.2

  # HTTP & API
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth
  google_sign_in: ^6.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Push Notifications
  onesignal_flutter: ^5.1.6

  # Sharing
  share_plus: ^12.0.2
  url_launcher: ^6.3.0

  # OTP Input UI
  pinput: ^5.0.0
  smart_auth: ^3.2.0

  # Video templates (autoplay in feed)
  visibility_detector: ^0.4.0+2

  # Utils
  intl: ^0.19.0
  permission_handler: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  device_info_plus: ^11.3.0
  package_info_plus: ^8.0.0
  flutter_plugin_android_lifecycle: ^2.0.31
  video_player: ^2.10.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
